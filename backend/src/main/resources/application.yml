spring:
  application:
    name: i-clinical-technology
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iclinical}
    username: ${DB_USERNAME:iclinical}
    password: ${DB_PASSWORD:iclinical}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-base-path: ${LOCAL_STORAGE_BASE_PATH:./storage}
    s3-bucket: ${AWS_S3_BUCKET:}
    s3-region: ${AWS_REGION:us-east-1}
  openai:
    api-key: ${OPENAI_API_KEY:}
