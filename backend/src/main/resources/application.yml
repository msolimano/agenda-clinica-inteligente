spring:
  application:
    name: i-clinical-technology
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iclinical}
    username: ${DB_USERNAME:iclinical}
    password: ${DB_PASSWORD:iclinical}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:21MB}

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    provider: ${DOCUMENT_AI_PROVIDER:mock}
    prompt-version: ${DOCUMENT_AI_PROMPT_VERSION:DOCUMENT-AI-V1}
    timeout-seconds: ${DOCUMENT_AI_TIMEOUT_SECONDS:45}
    max-input-bytes: ${DOCUMENT_AI_MAX_INPUT_BYTES:10485760}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_DOCUMENT_MODEL:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-base-path: ${LOCAL_STORAGE_BASE_PATH:./storage}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    s3-bucket: ${AWS_S3_BUCKET:}
    s3-region: ${AWS_REGION:us-east-1}
  openai:
    api-key: ${OPENAI_API_KEY:}
