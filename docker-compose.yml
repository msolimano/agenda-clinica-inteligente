services:
  postgres:
    image: postgres:16-alpine
    container_name: iclinical-postgres
    environment:
      POSTGRES_DB: iclinical
      POSTGRES_USER: iclinical
      POSTGRES_PASSWORD: iclinical
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iclinical -d iclinical"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
